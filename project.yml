name: Writeless

options:
  bundleIdPrefix: dev.romus
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.0
  WritelessCore:
    path: Packages/WritelessCore

targets:
  Writeless:
    type: application
    platform: macOS
    sources:
      - path: Writeless
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: WritelessCore
        product: WritelessCore
    settings:
      base:
        ARCHS: arm64
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # Swift cannot catch the NSException AVFAudio raises over an audio
        # format; Writeless/Support/WLExceptionGuard.m can.
        SWIFT_OBJC_BRIDGING_HEADER: Writeless/Support/Writeless-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        GCC_WARN_UNDECLARED_SELECTOR: YES
        CLANG_WARN_DOCUMENTATION_COMMENTS: YES

schemes:
  Writeless:
    build:
      targets:
        Writeless: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
