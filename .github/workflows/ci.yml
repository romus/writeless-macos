name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run WritelessCore tests
        run: make test

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ hashFiles('Writeless.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      # The committed project must match project.yml, which is the source of truth.
      - name: Check the generated project is in sync
        run: |
          brew install xcodegen
          make project
          git diff --exit-code -- Writeless.xcodeproj project.yml

      - name: Build (Release, ad-hoc signed)
        run: make release
